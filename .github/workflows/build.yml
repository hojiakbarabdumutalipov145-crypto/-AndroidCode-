name: Build APK from zip

on:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip latest project zip
        run: |
          ZIP=$(ls *.zip | sort -V | tail -1)
          echo "Using $ZIP"
          mkdir src && unzip -q "$ZIP" -d src
          SET=$(find src -name settings.gradle.kts | head -1)
          echo "PROJECT=$(dirname "$SET")" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: |
          cd "$PROJECT"
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/AndroidCode.apk"
          echo "VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: AndroidCode
          path: AndroidCode.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VER}-build${{ github.run_number }}" AndroidCode.apk \
            --title "Android code v${VER}" --notes "Zipdan avtomatik yigʻilgan APK" --latest
